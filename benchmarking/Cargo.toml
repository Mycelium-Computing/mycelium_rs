[package]
name = "benchmarking"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
mycelium = { workspace = true, features = ["std_runtime"] }
dust_dds = { version = "0.15.0" }
rand = "0.10.0-rc.5"
smol = "2.0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.32"

[[bin]]
name = "request_response_consumer"
path = "src/request_response/consumer.rs"

[[bin]]
name = "request_response_provider"
path = "src/request_response/provider.rs"
