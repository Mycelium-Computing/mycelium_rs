[workspace]
members = [
    "mycelium",
    "macros",
]
exclude = [
    "tests",
    "benchmarking",
    "usage_examples",
]
resolver = "3"

[workspace.package]
version = "0.0.2"
edition = "2024"
authors = ["Juan David Guevara Arévalo <david@jguevara.dev>"]
license = "MIT"
repository = "https://github.com/Mycelium-Computing/mycelium_rs"

[workspace.dependencies]
mycelium = { version = "0.0.2", path = "mycelium" }
mycelium-computing-macros = { version = "0.0.2", path = "macros" }

[profile.release]
debug = true
